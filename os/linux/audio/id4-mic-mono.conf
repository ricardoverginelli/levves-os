# Audient iD4: the mic (input 1) arrives on the left channel only of a stereo
# source (right is the unused instrument input), so recordings put the voice in
# the left ear. This adds a mono source fed from the left channel; install.sh
# makes it the default input. Linked into ~/.config/pipewire/pipewire.conf.d/.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "iD4 Mic (mono)"
            capture.props = {
                node.name = "capture.id4_mic_mono"
                target.object = "alsa_input.usb-Audient_Audient_iD4-00.HiFi__Mic__source"
                audio.position = [ FL ]
                stream.dont-remix = true
                node.passive = true
            }
            playback.props = {
                node.name = "id4_mic_mono"
                media.class = "Audio/Source"
                audio.position = [ MONO ]
            }
        }
    }
]
