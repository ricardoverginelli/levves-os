# keyd config for the ZUOYA GMK104 on Fedora (OS layout: Brazilian ABNT2).
# Install: sudo cp gmk104.conf /etc/keyd/ && sudo systemctl enable --now keyd
#
# keyd remaps physical keycodes before the BR layout is applied, so outputs
# are the BR keys that produce the wanted character:
#   ro    -> '/' (shift: '?')
#   slash -> ';' (shift: ':')   (physical key right of '.')
#   102nd -> '\' (shift: '|')   (key left of 'z' on ABNT2)

[ids]
320f:5055

[main]
# Windows key sends F13 (Tools) in this firmware mode -> restore Meta
f13 = leftmeta

# Key right of '.': tap '/', hold 500ms ';'
slash = timeout(ro, 500, slash)

[shift]
# Shift + key right of '.' -> '?'
slash = S-ro
# Shift + 'ç' -> ':'
semicolon = S-slash

[control]
# Ctrl + ']' (key left of Enter) -> '|'
backslash = S-102nd
