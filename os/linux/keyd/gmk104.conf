# keyd config for the ZUOYA GMK104 on Fedora (OS layout: Brazilian ABNT2).
# Install: sudo cp gmk104.conf /etc/keyd/ && sudo systemctl enable --now keyd
#
# keyd remaps physical keycodes before the BR layout is applied, so outputs
# are the BR keys that produce the wanted character:
#   ro    -> '/' (shift: '?')
#   slash -> ';' (shift: ':')   (physical key right of '.')
#   102nd -> '\' (shift: '|')   (key left of 'z' on ABNT2)

[ids]
# Wired
320f:5055
# Bluetooth (shows up as "ZUOYA GMK104-1")
245a:8276

[main]
# Windows key sends F13 (Tools) in this firmware mode -> restore Meta
f13 = leftmeta

# Key right of '.': tap '/', hold 500ms ';'
slash = timeout(ro, 500, slash)

# Numpad 5 toggles the mic (Plasma mutes the default source and shows the OSD)
kp5 = micmute

[shift]
# Shift + key right of '.' -> '?'
slash = S-ro
# Shift + 'ç' -> ':'
semicolon = S-slash

[control]
# Ctrl + ']' (key left of Enter) -> '|'
backslash = S-102nd

# Shift+Alt+PrtSc: with Alt held PrtSc becomes SysReq and KWin drops the Shift,
# so these hit the Alt+PrtSc shortcuts. Send F19 (no physical key) instead,
# for the capture hotkeys (~/repos/scripts/linux/capture)
[alt+shift]
sysrq = A-S-f19

[control+alt+shift]
sysrq = C-A-S-f19

# Ctrl+Alt+F10 is a VT switch in the xkb layout and never reaches Plasma; send
# F19 instead, for the replay-folder hotkey (~/repos/scripts/linux/capture)
[control+alt]
f10 = C-A-f19
