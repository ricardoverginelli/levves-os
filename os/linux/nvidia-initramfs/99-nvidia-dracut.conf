# Install: sudo bash install.sh (in this folder)
# Overrides /usr/lib/dracut/dracut.conf.d/99-nvidia-dracut.conf (which omits
# the driver). Loading nvidia in the initramfs gives one clean modeset and a
# graphical LUKS prompt. Kept in sync by /usr/local/sbin/nvidia-initramfs-sync.
add_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
